<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>Котигорошко</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <h1 class="title">Котигорошко</h1>

    <div class="game-shell">
      <div class="game-frame" id="gameFrame">
        <canvas id="gameCanvas"></canvas>

        <div class="hud">
          <div class="pill score" id="scorePill">0</div>
          <div class="pill best" id="bestPill">Рекорд 0</div>
        </div>

        <div class="overlay" id="overlay">
          <h2 id="overlayTitle">Котигорошко</h2>
          <p id="overlayScore" class="overlay-score hidden"></p>
          <p id="overlayHint" class="overlay-hint">
            Використовуй ← → або A/D для руху. Стрибай по платформах якомога вище!
          </p>
          <button id="playBtn" class="play-btn">Грати</button>
        </div>
      </div>

      <div class="touch-controls">
        <button id="leftBtn" class="touch-btn" aria-label="Вліво">&larr;</button>
        <button id="rightBtn" class="touch-btn" aria-label="Вправо">&rarr;</button>
      </div>
    </div>

    <p class="footer-note">Українська казкова гра — просто відкрий <code>index.html</code> і грай!</p>
  </div>

  <script src="game.js"></script>
</body>
</html>
